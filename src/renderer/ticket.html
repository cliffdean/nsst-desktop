<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>工單詳情</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <h1 id="tw-header">工單詳情</h1>
    <div class="topbar-actions">
      <button id="btn-tw-copy-id" type="button">複製工單號</button>
      <button id="btn-tw-jump-to-site" type="button" class="hidden" title="在主視窗查看這個專案的案場／裝機單資訊">查看裝機單</button>
      <button id="btn-tw-jump-to-project" type="button" class="hidden" title="在主視窗的專案查詢裡查看這個專案">查看專案</button>
      <button id="btn-tw-transfer" type="button" class="hidden" title="把工單改指派給別的工程師">轉單</button>
      <button id="btn-tw-reply" type="button" class="hidden" title="在主視窗左側開啟這張工單的回覆畫面">回覆</button>
      <button id="btn-tw-delete" type="button" class="hidden btn-danger" title="刪除這張工單(僅限專管)">刪除工單</button>
      <button id="btn-tw-reload" type="button" title="重新讀取這張工單">重新整理</button>
    </div>
  </header>

  <main id="tw-main">
    <h2 id="tw-title">讀取中...</h2>
    <p id="tw-not-own" class="hidden" style="color:#b6720c;background:#fdf1e0;padding:6px 8px;border-radius:4px;margin:0 0 8px;">
      這張工單不是指派給你的，僅供查詢檢視
    </p>
    <div id="tw-basic" class="info-grid wide-label"></div>
    <h4>說明</h4>
    <div id="tw-desc" class="detail-desc"></div>
    <h4>附件</h4>
    <div id="tw-attachments"></div>
    <h4>回覆記錄<span id="tw-reply-count" class="meta"></span></h4>
    <div id="tw-replies"></div>
  </main>

  <div id="image-preview-backdrop" class="modal-backdrop hidden">
    <div class="modal-box image-preview-box">
      <div class="modal-header">
        <h2 id="image-preview-title"></h2>
        <button id="btn-image-preview-open" title="用瀏覽器開啟">↗</button>
        <button id="btn-image-preview-close">✕</button>
      </div>
      <div id="image-preview-wrap" class="image-preview-wrap">
        <img id="image-preview-img" alt="">
        <video id="image-preview-video" controls class="hidden"></video>
      </div>
    </div>
  </div>

  <div id="transfer-ticket-backdrop" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>轉單</h2>
        <button id="btn-transfer-ticket-close">✕</button>
      </div>
      <p class="meta">轉單後工單狀態會變回「已指派」，可簡述轉單原因，有寫的話會記錄在工單回覆裡；不寫則不新增回覆。</p>
      <label>轉單對象(工程部在職人員)
        <select id="transfer-ticket-target"></select>
      </label>
      <label>開始日期(選填，不改就留原值；批次轉單時留空=各張維持原本的開始日期)
        <input type="datetime-local" id="transfer-ticket-start-time" />
      </label>
      <label>結束日期(選填，不改就留原值；批次轉單時留空=各張維持原本的結束日期)
        <input type="datetime-local" id="transfer-ticket-end-time" />
      </label>
      <label>轉單說明(選填，不寫就不會新增回覆)
        <textarea id="transfer-ticket-info" rows="4" placeholder="選填：說明轉單原因..."></textarea>
      </label>
      <div class="actions">
        <button id="btn-transfer-ticket-submit">確認轉單</button>
      </div>
      <p id="transfer-ticket-message" class="meta"></p>
    </div>
  </div>

  <script src="ticket-common.js"></script>
  <script src="ticket-window.js"></script>
</body>
</html>
