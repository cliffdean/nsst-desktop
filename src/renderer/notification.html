<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>提醒</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: stretch;
      background: #fff;
      color: #1f2430;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      border: 1px solid #2f6fd8;
      border-left: 5px solid #2f6fd8;
      box-shadow: 0 5px 18px rgba(31, 36, 48, 0.28);
    }
    main { flex: 1; padding: 18px 14px 14px; min-width: 0; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0; font-size: 13px; line-height: 1.5; word-break: break-word; }
    button {
      align-self: flex-start;
      margin: 10px 10px 0 0;
      padding: 2px 5px;
      border: 0;
      background: transparent;
      color: #667;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { color: #1f2430; }
  </style>
</head>
<body>
  <main>
    <h1 id="notification-title">提醒</h1>
    <p id="notification-body"></p>
  </main>
  <button id="notification-close" type="button" title="關閉提醒">&#10005;</button>
  <script>
    window.api.notification.onUpdate((data) => {
      document.getElementById('notification-title').textContent = data.title || '提醒';
      document.getElementById('notification-body').textContent = data.body || '';
    });
    document.getElementById('notification-close').addEventListener('click', () => {
      window.api.notification.close();
    });
  </script>
</body>
</html>
