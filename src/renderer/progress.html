<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>專案進度</title>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; }
    html, body { height: 100%; margin: 0; }
    body { background: #f4f5f7; color: #1f2430; font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #fff; border-bottom: 1px solid #e3e6eb; }
    header h1 { margin: 0; font-size: 16px; }
    button { cursor: pointer; }
    .btn { height: 32px; padding: 0 14px; border: 1px solid #d5dbe1; border-radius: 4px; background: #fff; }
    .btn.primary { background: #1677ff; border-color: #1677ff; color: #fff; font-weight: 600; }

    .filter { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 10px 14px; background: #fff; border-bottom: 1px solid #e3e6eb; }
    .field > label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 3px; }
    .field input[type=date] { height: 32px; border: 1px solid #d5dbe1; border-radius: 4px; padding: 0 6px; background: #fff; }
    .multi { position: relative; min-width: 200px; max-width: 340px; flex: 0 1 240px; }
    .multi.projects { min-width: 340px; max-width: 560px; flex: 1 1 380px; }
    .chips { height: 34px; box-sizing: border-box; border: 1px solid #d5dbe1; border-radius: 4px; padding: 3px 26px 3px 4px; display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; cursor: pointer; background: #fff; position: relative; overflow: hidden; }
    .chip.more { border-color: #d5dbe1; background: #f4f7fb; color: #555; }
    .chip.name { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .chips:after { content: "▾"; position: absolute; right: 9px; top: 7px; color: #666; }
    .placeholder { color: #999; padding: 4px 6px; }
    .chip { border: 1px solid #3b82f6; background: #eef5ff; color: #1d4ed8; border-radius: 3px; padding: 1px 6px; line-height: 20px; white-space: nowrap; }
    .chip i { cursor: pointer; margin-left: 6px; font-style: normal; font-weight: 700; }
    .drop { display: none; position: absolute; z-index: 50; left: 0; right: 0; top: 38px; background: #fff; border: 1px solid #d5dbe1; border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.14); max-height: 320px; overflow: auto; }
    .drop.open { display: block; }
    .drop input[type=text] { width: 100%; border: 0; border-bottom: 1px solid #e7ecf1; padding: 8px 10px; outline: none; }
    .drop label { display: flex; gap: 8px; align-items: center; padding: 5px 10px; cursor: pointer; }
    .drop label:hover { background: #f4f7fb; }
    .drop .hint { padding: 5px 10px; color: #888; font-size: 12px; border-bottom: 1px solid #f0f2f4; }
    .starred-only { display: flex; align-items: center; gap: 6px; height: 32px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .starred-only .st { color: #f5b301; }
    .zoom { display: flex; border: 1px solid #d5dbe1; border-radius: 4px; overflow: hidden; background: #fff; margin-left: auto; }
    .zoom button { border: 0; background: #fff; padding: 0 14px; height: 30px; border-right: 1px solid #e7ecf1; }
    .zoom button:last-child { border-right: 0; }
    .zoom button.active { background: #1677ff; color: #fff; }

    #wrap { flex: 1; min-height: 0; overflow: auto; background: #fff; margin: 10px 14px 4px; border: 1px solid #e7ecf1; border-radius: 6px; }
    #inner { position: relative; min-width: 100%; }
    .row { display: flex; border-bottom: 1px solid #eef1f4; height: 36px; }
    .row.head { position: sticky; top: 0; z-index: 6; height: 62px; background: #f7f9fb; }
    .row.project { background: #fafbfc; font-weight: 600; }
    .left { position: sticky; left: 0; z-index: 4; display: flex; flex: none; background: inherit; border-right: 1px solid #e0e5ea; }
    .row:not(.head):not(.project) .left { background: #fff; }
    .row.head .left { z-index: 8; }
    .c { flex: none; padding: 0 8px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .c.name { width: 300px; }
    .c.type { width: 70px; justify-content: center; }
    .c.kind { width: 100px; justify-content: center; }
    .c.pstage { width: 110px; justify-content: center; }
    .c.stage { width: 84px; justify-content: center; }
    .c.sev { width: 70px; justify-content: center; }
    .c.date { width: 62px; justify-content: center; }
    .c.date.overdue { color: #e5484d; font-weight: 700; }
    .c.user { width: 84px; justify-content: center; }
    .head .c { font-weight: 700; }
    .toggle { width: 18px; cursor: pointer; color: #666; flex: none; }
    .folder { margin-right: 6px; flex: none; }
    .count { color: #777; font-weight: 400; margin-left: 4px; }
    .star { cursor: pointer; margin-left: 6px; color: #c9ced4; font-size: 15px; }
    .star.on { color: #f5b301; }
    .tag { display: inline-block; min-width: 52px; text-align: center; color: #fff; border-radius: 3px; padding: 2px 6px; font-size: 12px; font-weight: 600; }
    .time { position: relative; flex: none; }
    .head .time { overflow: hidden; }
    .months, .ticks { position: relative; height: 31px; }
    .months div, .ticks div { position: absolute; top: 0; height: 100%; display: flex; align-items: center; font-size: 12px; color: #555; border-left: 1px solid #e3e8ed; padding-left: 6px; }
    .months div { font-weight: 700; font-size: 13px; color: #222; }
    .grid { position: absolute; top: 0; bottom: 0; width: 1px; background: #f0f2f4; }
    .bar { position: absolute; top: 6px; height: 24px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: 600; line-height: 24px; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .bar.project { text-align: center; }
    .today { position: absolute; top: 62px; bottom: 0; width: 0; border-left: 2px dashed #e5484d; z-index: 3; pointer-events: none; }
    .today-flag { position: absolute; top: 1px; transform: translateX(-50%); background: #e5484d; color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 3px; z-index: 7; }
    .empty { padding: 50px 20px; text-align: center; color: #888; }
    .ticket-link { color: inherit; cursor: pointer; text-decoration: none; }
    .ticket-link:hover { text-decoration: underline; color: #1677ff; }
    footer { padding: 4px 14px 8px; font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>專案進度</h1>
    <button id="btn-reload" class="btn" type="button">重新整理</button>
  </header>

  <div class="filter">
    <div class="field multi projects" id="projects-box">
      <label>專案名稱 (可複選，最多50個)</label>
      <div class="chips" id="projects-chips"></div>
      <div class="drop" id="projects-drop">
        <input type="text" id="projects-search" placeholder="搜尋專案名稱或編號" />
        <div class="hint" id="projects-hint"></div>
        <div id="projects-options"></div>
      </div>
    </div>
    <button id="btn-pick-starred" class="btn starred-only" type="button" title="將專案選擇改為所有加星的案件"><span class="st">★</span> 選取加星案件</button>
    <div class="field multi" id="status-box">
      <label>工單狀態 (可複選)</label>
      <div class="chips"></div>
      <div class="drop"><div class="options"></div></div>
    </div>
    <div class="field multi" id="user-box">
      <label>負責人 (可複選)</label>
      <div class="chips"></div>
      <div class="drop"><div class="options"></div></div>
    </div>
    <div class="field">
      <label>日期範圍</label>
      <input type="date" id="date-from" /> ~ <input type="date" id="date-to" />
    </div>
    <div class="field">
      <button id="btn-search" class="btn primary" type="button">查詢</button>
      <button id="btn-reset" class="btn" type="button">重設</button>
    </div>
    <div class="zoom" id="zoom">
      <button type="button" data-zoom="day">日</button>
      <button type="button" data-zoom="week" class="active">週</button>
      <button type="button" data-zoom="month">月</button>
    </div>
  </div>

  <div id="wrap"><div id="inner"><div class="empty">讀取中...</div></div></div>
  <footer>只列出未完成的工單(不含成功、已關閉、已刪除)；結束日已過但尚未完成的標示為逾期(結束日紅字、時間條紅色)。加星與網頁端、所有人的桌面工具共用同一份。</footer>

  <script src="progress-window.js"></script>
</body>
</html>
